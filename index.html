<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词汇记忆 · 分组短文</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #22262e;
    --muted: #7a7f8a;
    --accent: #c2185b;
    --accent-soft: #fde7ef;
    --line: #e7e3db;
    --side-bg: #efece5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Times New Roman", "PingFang SC", "Microsoft YaHei", serif;
    line-height: 1.8;
  }

  /* 左右框架 */
  .frame {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
  }

  /* 左栏：分组导航 */
  .sidebar {
    background: var(--side-bg);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 24px 16px;
  }
  .sidebar h1 {
    font-size: 18px;
    margin: 0 0 4px;
    letter-spacing: .5px;
  }
  .sidebar .sub {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 20px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .grp {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: all .15s ease;
  }
  .grp:hover { border-color: var(--accent); transform: translateX(2px); }
  .grp .no { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .grp .range { color: var(--muted); font-size: 12px; }
  .grp.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .grp.active .no, .grp.active .range { color: #ffe3ee; }
  .grp.disabled {
    opacity: .45;
    cursor: not-allowed;
  }
  .grp.disabled:hover { transform: none; border-color: var(--line); }
  /* 左栏「短文」小标 */
  .grp .badge {
    float: right;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(200, 40, 80, .10);
    color: var(--accent);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .grp.active .badge { background: rgba(255,255,255,.25); color: #fff; }
  /* 无故事组的提示条 */
  .no-story {
    font-size: 13px;
    color: var(--muted);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: rgba(0,0,0,.03);
    border-left: 3px solid var(--line);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    margin: 0 0 18px;
    line-height: 1.7;
  }
  .pending-note {
    font-size: 12px;
    color: var(--muted);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(0,0,0,.03);
    border-radius: 8px;
    line-height: 1.6;
  }

  /* 右栏：内容 */
  .content {
    overflow-y: auto;
    padding: 40px 48px 60px;
  }
  .content-inner { max-width: 760px; margin: 0 auto; }
  .group-title {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
  }
  .story-title {
    font-size: 26px;
    margin: 0 0 8px;
    letter-spacing: .5px;
  }
  .story-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 24px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 故事切换标签 */
  .story-tabs {
    display: none;
    gap: 10px;
    margin: 0 0 22px;
    flex-wrap: wrap;
  }
  .story-tab {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
  }
  .story-tab:hover { border-color: var(--accent); color: var(--accent); }
  .story-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .story-tab .tab-no { font-size: 11px; opacity: .75; margin-right: 6px; }

  /* 本组单词 chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .chip {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #f3c1d6;
    border-radius: 999px;
    padding: 3px 12px;
    cursor: help;
  }

  /* 短文 */
  .story { border-top: 1px solid var(--line); padding-top: 26px; }
  .story p {
    margin: 0 0 20px;
    font-size: 18px;
    text-align: justify;
  }
  .story p:last-child { margin-bottom: 0; }

  /* 目标词 */
  .word {
    font-weight: 700;
    color: var(--accent);
    border-bottom: 1.5px dashed var(--accent);
    cursor: help;
    position: relative;
  }
  .word:hover { background: var(--accent-soft); border-radius: 3px; }

  /* 释义卡片 */
  #tooltip {
    position: fixed;
    width: 330px;
    background: #2b2f3a;
    color: #f2f3f7;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 12px 34px rgba(0,0,0,.32);
    z-index: 999;
    display: none;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.55;
    pointer-events: auto;
  }
  #tooltip .tip-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  #tooltip .tip-word { font-size: 20px; font-weight: 700; color: #fff; }
  #tooltip .tip-freq { font-size: 12px; color: #9aa0ad; }
  #tooltip .tip-ipa { font-size: 14px; color: #ffd6e5; margin-bottom: 4px; }
  #tooltip .tip-zh { font-size: 16px; color: #fff; margin-bottom: 8px; font-weight: 600; }
  #tooltip .tip-label {
    font-size: 11px;
    color: #9aa0ad;
    letter-spacing: 1px;
    margin: 8px 0 2px;
    text-transform: uppercase;
  }
  #tooltip .tip-en { font-size: 13px; color: #dfe2ea; }
  #tooltip .tip-ex {
    font-size: 13px;
    color: #c6cbd6;
    font-style: italic;
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin-top: 4px;
  }
  #tooltip .tip-btns {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  #tooltip .play {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: filter .15s ease;
  }
  #tooltip .play:hover { filter: brightness(1.15); }

  /* 中文翻译 + 词汇表 */
  .section { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 24px; }
  .section-title {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 16px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
  }
  .trans p {
    margin: 0 0 18px;
    font-size: 16px;
    color: #4a4f5c;
    text-align: justify;
    line-height: 1.9;
  }
  .trans p:last-child { margin-bottom: 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: .5px;
  }
  tr:hover td { background: #faf8f5; }
  td.en { font-weight: 700; color: var(--accent); }
  td.ipa { color: #6b7280; }
  td.freq { color: var(--muted); }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 30px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
</style>
</head>

/* ===================== 渲染 ===================== */
const groupList = document.getElementById('groupList');
const tooltip = document.getElementById('tooltip');
const elTitle = document.getElementById('groupTitle');
const elStoryTitle = document.getElementById('storyTitle');
const elStoryDesc = document.getElementById('storyDesc');
const elChips = document.getElementById('chips');
const elStory = document.getElementById('story');
const elTrans = document.getElementById('trans');
const elStoryTabs = document.getElementById('storyTabs');
const elNoStory = document.getElementById('noStory');
const elTransSection = document.getElementById('transSection');
const elWordTableBody = document.querySelector('#wordTable tbody');
let currentGroup = null;
let currentStory = 0;   // 0 = 主故事, 1 = 第二篇故事

// 左栏：全部已生成的组（当前 30 组）
function renderSidebar() {
  let html = '';
  groups.forEach(g => {
    const hasStory = !!g.storyHTML;
    html += `<button class="grp" data-id="${g.id}">
      <span class="no">第 ${g.id} 组</span>
      <span class="range">${g.words[0]} — ${g.words[g.words.length-1]}</span>
      ${hasStory ? '<span class="badge">短文</span>' : ''}
    </button>`;
  });
  groupList.innerHTML = html;
}

// 取当前组正在显示的那篇故事
function activeStory(g) {
  return (currentStory === 1 && g.altStory) ? g.altStory : g;
}

// 只切换故事正文/标题/翻译（chips 与词汇表两篇共用，不重绘）
function applyStory(g) {
  const hasStory = !!g.storyHTML;
  elNoStory.style.display = hasStory ? 'none' : 'block';
  elStoryTitle.style.display = hasStory ? '' : 'none';
  elStoryDesc.style.display = hasStory ? '' : 'none';
  elStory.style.display = hasStory ? '' : 'none';
  elTransSection.style.display = hasStory ? '' : 'none';
  if (!hasStory) {
    elStoryTitle.textContent = '';
    elStoryDesc.textContent = '';
    elStory.innerHTML = '';
    elTrans.innerHTML = '';
    return;
  }
  const s = activeStory(g);
  elStoryTitle.textContent = s.storyTitle;
  elStoryDesc.textContent = s.storyDesc;
  elStory.innerHTML = s.storyHTML;
  elTrans.innerHTML = s.storyZhHTML || '';
  document.querySelectorAll('.story-tab').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.idx) === currentStory);
  });
}

// 渲染故事切换标签（仅当该组有第二篇故事时显示）
function renderStoryTabs(g) {
  if (!g.altStory || !g.storyHTML) {
    elStoryTabs.style.display = 'none';
    elStoryTabs.innerHTML = '';
    return;
  }
  elStoryTabs.style.display = 'flex';
  elStoryTabs.innerHTML = `
    <button class="story-tab" data-idx="0"><span class="tab-no">故事一</span>${g.storyTitle}</button>
    <button class="story-tab" data-idx="1"><span class="tab-no">故事二 · ${g.altStory.tag || '换境'}</span>${g.altStory.storyTitle}</button>`;
}

// 右栏渲染某组
function renderGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  currentGroup = id;
  currentStory = 0;                 // 换组时默认回到故事一
  elTitle.textContent = `第 ${g.id} 组 · ${g.words.length} 词`;

  renderStoryTabs(g);
  applyStory(g);

  elChips.innerHTML = g.words.map(w =>
    `<span class="chip word" data-w="${w}">${w}</span>`
  ).join('');

  // 词汇表
  elWordTableBody.innerHTML = g.words.map((w, i) => {
    const d = g.defs[w] || { pos:'', zh:'', ipa:'—', freq:'' };
    return `<tr>
      <td class="en">${w}</td>
      <td>${d.pos}</td>
      <td class="ipa">${d.ipa}</td>
      <td>${d.zh}</td>
      <td class="freq">${d.freq}</td>
    </tr>`;
  }).join('');

  // 左栏高亮
  document.querySelectorAll('.grp').forEach(b => {
    b.classList.toggle('active', b.dataset.id == id);
  });
}

/* ===================== 悬停释义 ===================== */
function getDef(word) {
  const g = groups.find(x => x.id === currentGroup);
  return g && g.defs[word];
}

let hideTimer = null;
let activeWordEl = null;

function clearHide() {
  if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
}

function showTip(wordEl) {
  const word = wordEl.dataset.w;
  const d = getDef(word);
  if (!d) return;
  clearHide();
  activeWordEl = wordEl;
  tooltip.innerHTML = `
    <div class="tip-head">
      <span class="tip-word">${word}</span>
      <span class="tip-freq">词频 ${d.freq}</span>
    </div>
    <div class="tip-ipa">${d.pos ? d.pos + ' · ' : ''}${d.ipa}</div>
    <div class="tip-zh">${d.zh}</div>
    ${d.en ? `<div class="tip-label">英文释义</div>
    <div class="tip-en">${d.en}</div>` : ''}
    ${d.ex ? `<div class="tip-label">例句</div>
    <div class="tip-ex">${d.ex}</div>` : ''}
    <div class="tip-btns">
      <button class="play" data-w="${word}" data-accent="uk">🔊 英音</button>
      <button class="play" data-w="${word}" data-accent="us">🔊 美音</button>
    </div>`;
  tooltip.style.display = 'block';
  positionTip(wordEl);
}

// 卡片锚定在单词正下方，不再跟随鼠标，这样按钮始终可点
function positionTip(wordEl) {
  const r = wordEl.getBoundingClientRect();
  const w = tooltip.offsetWidth;
  const h = tooltip.offsetHeight;
  let left = r.left;
  let top = r.bottom + 4;
  if (top + h > window.innerHeight - 8) top = r.top - h - 4;
  if (left + w > window.innerWidth - 8) left = window.innerWidth - 8 - w;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

// 离开单词和卡片后延迟隐藏，留出把鼠标移到按钮上的时间
function scheduleHide() {
  clearHide();
  hideTimer = setTimeout(() => {
    tooltip.style.display = 'none';
    activeWordEl = null;
  }, 300);
}

document.addEventListener('mouseover', e => {
  const w = e.target.closest('.word');
  if (w && w.dataset.w) {
    showTip(w);
    return;
  }
  if (e.target.closest('#tooltip')) {
    clearHide();
  }
});

document.addEventListener('mouseout', e => {
  const rel = e.relatedTarget;
  if (rel && (rel.closest('.word') || rel.closest('#tooltip'))) return;
  scheduleHide();
});

/* ===================== 发音 ===================== */
function audioWord(w) {
  // 多词条（如 "a, an"、"according to"）取第一个词发音
  return w.split(/[ ,]/)[0];
}
// 缓存浏览器内置语音引擎列表
let voices = [];
function loadVoices() {
  try { voices = window.speechSynthesis.getVoices(); } catch (e) { voices = []; }
}
function pickVoice(accent) {
  const lang = accent === 'uk' ? 'en-GB' : 'en-US';
  return voices.find(v => v.lang === lang)
      || voices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith(lang))
      || voices.find(v => v.lang.toLowerCase().startsWith('en'));
}
if ('speechSynthesis' in window) {
  // 提前多轮加载语音列表（部分浏览器首次 getVoices 返回空）
  loadVoices();
  setTimeout(loadVoices, 50);
  setTimeout(loadVoices, 300);
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  // 页面加载即预热语音引擎，消除首次点击的冷启动延迟
  try {
    const warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0;
    warm.rate = 1;
    window.speechSynthesis.speak(warm);
  } catch (e) {}
}

// 浏览器内置发音：无需联网，英音=en-GB、美音=en-US
function speak(w, accent) {
  const aw = audioWord(w);
  const lang = accent === 'uk' ? 'en-GB' : 'en-US';
  const u = new SpeechSynthesisUtterance(aw);
  u.lang = lang;
  u.rate = 1;
  const v = pickVoice(accent);
  if (v) u.voice = v;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// 有道真人发音（备用：在系统浏览器中直接打开本文件时音质更好）
function playYoudao(w, accent) {
  const aw = audioWord(w);
  const type = accent === 'uk' ? 1 : 2;   // type=1 英音, type=2 美音
  const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(aw)}&type=${type}`;
  const a = new Audio(url);
  a.play().catch(() => {});
}

function playAudio(w, accent) {
  if ('speechSynthesis' in window) {
    speak(w, accent);
  } else {
    playYoudao(w, accent);
  }
}

document.addEventListener('click', e => {
  // 故事一 / 故事二 切换
  const tab = e.target.closest('.story-tab');
  if (tab) {
    const g = groups.find(x => x.id === currentGroup);
    if (g) {
      currentStory = Number(tab.dataset.idx);
      applyStory(g);
      clearHide();
      tooltip.style.display = 'none';
    }
    return;
  }
  const g = e.target.closest('.grp');
  if (g && !g.classList.contains('disabled')) {
    renderGroup(parseInt(g.dataset.id, 10));
    clearHide();
    tooltip.style.display = 'none';
    return;
  }
  const b = e.target.closest('.play');
  if (b) {
    playAudio(b.dataset.w, b.dataset.accent);
  }
});

/* ===================== 初始化 ===================== */
renderSidebar();
renderGroup(1);
</script>
</body>
</html>
