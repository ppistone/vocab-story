<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词汇记忆 · 分组短文</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #22262e;
    --muted: #7a7f8a;
    --accent: #c2185b;
    --accent-soft: #fde7ef;
    --line: #e7e3db;
    --side-bg: #efece5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Times New Roman", "PingFang SC", "Microsoft YaHei", serif;
    line-height: 1.8;
  }

  /* 左右框架 */
  .frame {
    display: grid;
    grid-template-columns: 312px 1fr;
    height: 100vh;
  }

  /* 左栏：分组导航 */
  .sidebar {
    background: var(--side-bg);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 24px 16px;
  }
  .sidebar h1 {
    font-size: 18px;
    margin: 0 0 4px;
    letter-spacing: .5px;
  }
  .sidebar .sub {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 20px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .grp {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 54px 11px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: all .15s ease;
  }
  .grp:hover { border-color: var(--accent); transform: translateX(2px); }
  .grp .no { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .grp .range {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    display: inline-block;
    max-width: calc(100% - 62px);
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: bottom;
  }
  .grp.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .grp.active .no, .grp.active .range { color: #ffe3ee; }
  .grp.disabled {
    opacity: .45;
    cursor: not-allowed;
  }
  .grp.disabled:hover { transform: none; border-color: var(--line); }
  /* 左栏「短文」小标：绝对定位固定在右侧垂直居中，永不换行 */
  .grp .badge {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    font-size: 11px;
    line-height: 1.5;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(200, 40, 80, .10);
    color: var(--accent);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    white-space: nowrap;
    pointer-events: none;
  }
  .grp.active .badge { background: rgba(255,255,255,.25); color: #fff; }
  /* 无故事组的提示条 */
  .no-story {
    font-size: 13px;
    color: var(--muted);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: rgba(0,0,0,.03);
    border-left: 3px solid var(--line);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    margin: 0 0 18px;
    line-height: 1.7;
  }
  .pending-note {
    font-size: 12px;
    color: var(--muted);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(0,0,0,.03);
    border-radius: 8px;
    line-height: 1.6;
  }

  /* 右栏：内容 */
  .content {
    overflow-y: auto;
    padding: 30px 22px 60px;
  }
  /* 内容区铺满右栏，不再限宽 */
  .content-inner { max-width: 100%; margin: 0; }
  /* 故事正文与翻译保持易读行宽 */
  .story-title, .story-desc, .chips, .story, .trans, .no-story { max-width: 880px; }
  .group-title {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
  }
  .story-title {
    font-size: 26px;
    margin: 0 0 8px;
    letter-spacing: .5px;
  }
  .story-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 24px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 故事切换标签 */
  .story-tabs {
    display: none;
    gap: 10px;
    margin: 0 0 22px;
    flex-wrap: wrap;
  }
  .story-tab {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
  }
  .story-tab:hover { border-color: var(--accent); color: var(--accent); }
  .story-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .story-tab .tab-no { font-size: 11px; opacity: .75; margin-right: 6px; }

  /* 本组单词 chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .chip {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #f3c1d6;
    border-radius: 999px;
    padding: 3px 12px;
    cursor: help;
  }

  /* 短文 */
  .story { border-top: 1px solid var(--line); padding-top: 26px; }
  .story p {
    margin: 0 0 20px;
    font-size: 18px;
    text-align: justify;
  }
  .story p:last-child { margin-bottom: 0; }

  /* 目标词 */
  .word {
    font-weight: 700;
    color: var(--accent);
    border-bottom: 1.5px dashed var(--accent);
    cursor: help;
    position: relative;
  }
  .word:hover { background: var(--accent-soft); border-radius: 3px; }

  /* 释义卡片 */
  #tooltip {
    position: fixed;
    width: 330px;
    background: #2b2f3a;
    color: #f2f3f7;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 12px 34px rgba(0,0,0,.32);
    z-index: 999;
    display: none;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.55;
    pointer-events: auto;
  }
  #tooltip .tip-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  #tooltip .tip-word { font-size: 20px; font-weight: 700; color: #fff; }
  #tooltip .tip-freq { font-size: 12px; color: #9aa0ad; }
  #tooltip .tip-ipa { font-size: 14px; color: #ffd6e5; margin-bottom: 4px; }
  #tooltip .tip-zh { font-size: 16px; color: #fff; margin-bottom: 8px; font-weight: 600; }
  #tooltip .tip-label {
    font-size: 11px;
    color: #9aa0ad;
    letter-spacing: 1px;
    margin: 8px 0 2px;
    text-transform: uppercase;
  }
  #tooltip .tip-en { font-size: 13px; color: #dfe2ea; }
  #tooltip .tip-ex {
    font-size: 13px;
    color: #c6cbd6;
    font-style: italic;
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    margin-top: 4px;
  }
  #tooltip .tip-btns {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  #tooltip .play {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: filter .15s ease;
  }
  #tooltip .play:hover { filter: brightness(1.15); }

  /* 中文翻译 + 词汇表 */
  .section { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 24px; }
  .section-title {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 16px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
  }
  .trans p {
    margin: 0 0 18px;
    font-size: 16px;
    color: #4a4f5c;
    text-align: justify;
    line-height: 1.9;
  }
  .trans p:last-child { margin-bottom: 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: .5px;
  }
  tr:hover td { background: #faf8f5; }
  td.en { font-weight: 700; color: var(--accent); }
  td.ipa { color: #6b7280; white-space: nowrap; }
  /* 音标后的小喇叭：点击即读美式发音 */
  .spk {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    margin-left: 6px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #fff;
    color: var(--accent);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    vertical-align: middle;
    transition: all .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .spk:hover { background: var(--accent); border-color: var(--accent); }
  .spk:active { transform: scale(.9); }
  .spk.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  td.freq { color: var(--muted); }
  td.clip { white-space: nowrap; }
  /* 常见搭配列 */
  td.colloc {
    font-size: 12.5px;
    color: #4a4f5c;
    line-height: 1.55;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  td.colloc .co { display: block; }
  td.colloc .co + .co { margin-top: 3px; }
  td.colloc b { color: var(--accent); font-weight: 700; }
  td.colloc .none { color: #c9c9c9; }
  /* 表格铺满右栏，7 列一次全部显示，无横向滚动 */
  .table-wrap { overflow-x: visible; }
  #wordTable { width: 100%; min-width: 0; table-layout: auto; }
  #wordTable th, #wordTable td { padding: 8px 10px; }
  #wordTable td.en  { white-space: nowrap; }
  #wordTable td.pos { white-space: nowrap; font-size: 12.5px; color: #6b7280; }
  #wordTable td.freq { white-space: nowrap; }
  /* 极窄屏（<1240px）兜底：恢复横向滚动，避免挤压变形 */
  @media (max-width: 1240px) {
    .table-wrap { overflow-x: auto; }
    #wordTable { min-width: 820px; }
  }
  /* 经典例句（getyarn.io 影视原声）链接 */
  .yarn {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: all .15s ease;
  }
  .yarn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 30px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
</style>
</head>

<div class="frame">
  <!-- 左栏 -->
  <aside class="sidebar">
    <h1>英语词汇记忆</h1>
    <p class="sub">每 20 词一组 · 点击查看词表与发音</p>
    <div id="groupList"></div>
    <div class="pending-note">

    </div>
  </aside>

  <!-- 右栏 -->
  <main class="content">

      <div class="group-title" id="groupTitle"></div>
      <div class="story-tabs" id="storyTabs"></div>
      <h2 class="story-title" id="storyTitle"></h2>

      <div class="chips" id="chips"></div>
      <div class="story" id="story"></div>

      <div class="section" id="transSection">
        <h3 class="section-title">中文翻译</h3>
        <div class="trans" id="trans"></div>
      </div>

      <div class="section">
        <h3 class="section-title">本组词汇表</h3>
        <div class="table-wrap">
        <table id="wordTable">
          <thead>
            <tr><th>单词</th><th>词性</th><th>音标</th><th>中文释义</th><th>常见搭配</th><th>词频</th><th>经典例句</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        </div>
      </div>

      <p class="hint">提示：把鼠标悬停在任意单词上查看释义，点「英音 / 美音」按钮播放读音（浏览器内置发音，无需联网）。第 1 组有两篇故事，可点上方标签切换。</p>
    </div>
  </main>
</div>

<!-- 悬停释义卡片 -->
<div id="tooltip"></div>

      <p>提前预告：这条小猎兔犬能跑。玛雅拍下他绕着院子做有氧狂奔的样子——舌头甩着、耳朵往后——这段视频把一个"没希望"的案例变成了一张等候名单。收容所领养日免费入场。到头来，冒险本身才是重点。</p>

    storyZhHTML: `
      <p>多萝西发现那只猫的时候，它已经住在图书馆后面的小巷里了——瘦、吵，几乎算得上友好。当然，她对猫过敏。她还七十八岁了，早就不在乎这种小障碍。</p>

      <p>所有的孩子都喜欢他。一个从没在馆内出过声的男孩开始在角落里对着他大声朗读，此后就再没停过。猫并不在乎故事，他在乎的是那个声音。两人没有一点相像，却以完全相同的方式活着。</p>
      <p>理事会自然知道了。开了会，投了票，多萝西拿到每月一笔猫粮补贴，和一条硬规矩：梅尔维尔不许上桌。她沿着墙把毯子摆正，为了本地报纸的照片把猫高高举起，多年来第一次不觉得孤单。</p>
      <p>alien 这个词的意思是"外来的"，而多萝西在自己的小镇里一直有点这种感觉。这只猫改变了它。没有什么比沉默更能让人疏离，也没有什么比有人大声读书更能把人拉回来。</p>

      <p>它的祖先曾在陆地上行走，这是本文最奇怪的一句话。答案花了六个月的分析。工程师的角度很聪明：按十二度而不是九十度悬挂，天花板承受的应力就减半。于是这座空间充裕、却没钱的博物馆，忽然有了方案。</p>
      <p>当地电视台的主播来拍它。她想要一段轶事，一点人情味。结果她拍到的是守夜人：他在那头鲸下面扫了三十年地，十秒钟就能分析出一个参观者的心情。</p>
      <p>博物馆还开了儿童厅，一段循环播放的小动物动画能让幼儿着迷好几个小时。"娱乐被低估了，"守夜人说，"人就是这样学会东西的。"</p>
      <p>最后鲸挂上去了，馆里唯一的气愤来自一位希望它挂得更低的策展人。没人气太久。后来，同一栋楼里的一位牙医开了场讲座，讲"鲸的麻醉"——主要是开玩笑。</p>

    storyZhHTML: `
      <p>证件从外套口袋里掏出来，厨房就安静了。卫生检查员不需要提高嗓门，他们只需要意识到所有人都不说话了。离油锅远一点的地方，一个厨师正用一块难看的灰抹布擦手。</p>

      <p>老板五十多岁的单身汉，二十二岁起就经营这家店。他跟着我回到柜台，站成一个别扭的角度，半侧着身子往后看自己的厨师。</p>

      <p>广场上那家面包店有个阳台、一个秃头老板，还有一条所有人都无视的禁打手机规定。他叫彼得，全镇公认脾气最坏的人——也是最好的面包师。</p>

      <p>我让他六十块拿走了。撇开一切不说，他是个好修车匠，这车还能跑起来。回家路上，我在纪念碑旁的长椅上坐了一会儿，试着把想法往好里掰。输的好处，我告诉自己，是你可以把自己的偏见收好。一辆自行车，跟一桩旧怨不同，是能留在世上的一件有益的东西。</p>

      <p>早上世界回来了，白而静，棚屋后面的李子树居然开花了——在四月的暴风雪里。天气就是这样，她说。它把规矩弄模糊，然后停下来。</p>

      <p>我父亲只吹一件事：那条船。他是借钱把她买下来的，那一年我出生；四年他还清了，他认为那是他这辈子做过最胆大的事。</p>

    storyZhHTML: `
      <p>我老板是九号公路那家保龄球馆的主人，他只有两个话题：植物学和拳击。他声称，这两样都讲究时机。第二个他没说错。</p>

      <p>隔壁那家银行支行想要这块地，街角的刹车修理店也想要。他不卖。他说，四号道边垫上弹一下的价值，比整张损益表底行还大；说完自己也笑了。</p>

/* ===================== 渲染 ===================== */
const groupList = document.getElementById('groupList');
const tooltip = document.getElementById('tooltip');
const elTitle = document.getElementById('groupTitle');
const elStoryTitle = document.getElementById('storyTitle');
const elStoryDesc = document.getElementById('storyDesc');
const elChips = document.getElementById('chips');
const elStory = document.getElementById('story');
const elTrans = document.getElementById('trans');
const elStoryTabs = document.getElementById('storyTabs');
const elNoStory = document.getElementById('noStory');
const elTransSection = document.getElementById('transSection');
const elWordTableBody = document.querySelector('#wordTable tbody');
let currentGroup = null;
let currentStory = 0;   // 0 = 主故事, 1 = 第二篇故事

// 左栏：全部已生成的组（当前 30 组）
function renderSidebar() {
  let html = '';
  groups.forEach(g => {
    const hasStory = !!g.storyHTML;
    html += `<button class="grp" data-id="${g.id}">
      <span class="no">第 ${g.id} 组</span>
      <span class="range">${g.words[0]} — ${g.words[g.words.length-1]}</span>
      ${hasStory ? '<span class="badge">短文</span>' : ''}
    </button>`;
  });
  groupList.innerHTML = html;
}

// 取当前组正在显示的那篇故事
function activeStory(g) {
  return (currentStory === 1 && g.altStory) ? g.altStory : g;
}

// 只切换故事正文/标题/翻译（chips 与词汇表两篇共用，不重绘）
function applyStory(g) {
  const hasStory = !!g.storyHTML;
  elNoStory.style.display = hasStory ? 'none' : 'block';
  elStoryTitle.style.display = hasStory ? '' : 'none';
  elStoryDesc.style.display = hasStory ? '' : 'none';
  elStory.style.display = hasStory ? '' : 'none';
  elTransSection.style.display = hasStory ? '' : 'none';
  if (!hasStory) {
    elStoryTitle.textContent = '';
    elStoryDesc.textContent = '';
    elStory.innerHTML = '';
    elTrans.innerHTML = '';
    return;
  }
  const s = activeStory(g);
  elStoryTitle.textContent = s.storyTitle;
  elStoryDesc.textContent = s.storyDesc;
  elStory.innerHTML = s.storyHTML;
  elTrans.innerHTML = s.storyZhHTML || '';
  document.querySelectorAll('.story-tab').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.idx) === currentStory);
  });
}

// 渲染故事切换标签（仅当该组有第二篇故事时显示）
function renderStoryTabs(g) {
  if (!g.altStory || !g.storyHTML) {
    elStoryTabs.style.display = 'none';
    elStoryTabs.innerHTML = '';
    return;
  }
  elStoryTabs.style.display = 'flex';
  elStoryTabs.innerHTML = `
    <button class="story-tab" data-idx="0"><span class="tab-no">故事一</span>${g.storyTitle}</button>
    <button class="story-tab" data-idx="1"><span class="tab-no">故事二 · ${g.altStory.tag || '换境'}</span>${g.altStory.storyTitle}</button>`;
}

// 把词条转成 getyarn.io 的搜索词：
// "a, an"→a ; "BC/B.C."→BC ; "analyse/-yze"→analyse ; "afterward(s)"→afterward
// "behavior(u)r"→behavior ; "according to" 原样保留
function yarnQuery(w) {
  let q = w.split(/[,/]/)[0];
  const m = q.match(/^([a-z]+)\([a-z]*\)[a-z]*$/i);   // 带可选字母的词形，取括号前部分
  if (m) q = m[1];
  q = q.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
  return q || w;
}
function yarnUrl(w) {
  return 'https://getyarn.io/yarn-find?text=' + encodeURIComponent(yarnQuery(w));
}

// 常见搭配单元格：每行一个搭配，加粗该词本身
function escHTML(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function collocHTML(w) {
  const list = (typeof COLLOC !== 'undefined' && COLLOC[w]) || [];
  if (!list.length) return '<span class="none">—</span>';
  return list.map(p => `<span class="co">${boldHead(p, w)}</span>`).join('');
}
// 把搭配里出现的该词加粗（用与例句链接一致的词形归一化规则）
function boldHead(phrase, w) {
  const core = yarnQuery(w);
  let out = escHTML(phrase);
  if (!core) return out;
  try {
    const safe = core.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp('\\b(' + safe + ')', 'i'), '<b>$1</b>');
  } catch (e) {}
  return out;
}

// 右栏渲染某组
function renderGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  currentGroup = id;
  currentStory = 0;                 // 换组时默认回到故事一
  elTitle.textContent = `第 ${g.id} 组 · ${g.words.length} 词`;

  renderStoryTabs(g);
  applyStory(g);

  elChips.innerHTML = g.words.map(w =>
    `<span class="chip word" data-w="${w}">${w}</span>`
  ).join('');

  // 词汇表
  elWordTableBody.innerHTML = g.words.map((w, i) => {
    const d = g.defs[w] || { pos:'', zh:'', ipa:'—', freq:'' };
    return `<tr>
      <td class="en">${w}</td>
      <td class="pos">${d.pos}</td>
      <td class="ipa">${d.ipa}<button class="spk" data-w="${w}" title="美式发音" aria-label="听 ${w} 的美式发音">🔊</button></td>
      <td>${d.zh}</td>
      <td class="colloc">${collocHTML(w)}</td>
      <td class="freq">${d.freq}</td>
      <td class="clip"><a class="yarn" href="${yarnUrl(w)}" target="_blank" rel="noopener" title="在 getyarn.io 看「${yarnQuery(w)}」的影视原声例句">🎬 看例句</a></td>
    </tr>`;
  }).join('');

  // 左栏高亮
  document.querySelectorAll('.grp').forEach(b => {
    b.classList.toggle('active', b.dataset.id == id);
  });
}

/* ===================== 悬停释义 ===================== */
function getDef(word) {
  const g = groups.find(x => x.id === currentGroup);
  return g && g.defs[word];
}

let hideTimer = null;
let activeWordEl = null;

function clearHide() {
  if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
}

function showTip(wordEl) {
  const word = wordEl.dataset.w;
  const d = getDef(word);
  if (!d) return;
  clearHide();
  activeWordEl = wordEl;
  tooltip.innerHTML = `
    <div class="tip-head">
      <span class="tip-word">${word}</span>
      <span class="tip-freq">词频 ${d.freq}</span>
    </div>
    <div class="tip-ipa">${d.pos ? d.pos + ' · ' : ''}${d.ipa}</div>
    <div class="tip-zh">${d.zh}</div>
    ${d.en ? `<div class="tip-label">英文释义</div>
    <div class="tip-en">${d.en}</div>` : ''}
    ${d.ex ? `<div class="tip-label">例句</div>
    <div class="tip-ex">${d.ex}</div>` : ''}
    <div class="tip-btns">
      <button class="play" data-w="${word}" data-accent="uk">🔊 英音</button>
      <button class="play" data-w="${word}" data-accent="us">🔊 美音</button>
    </div>`;
  tooltip.style.display = 'block';
  positionTip(wordEl);
}

// 卡片锚定在单词正下方，不再跟随鼠标，这样按钮始终可点
function positionTip(wordEl) {
  const r = wordEl.getBoundingClientRect();
  const w = tooltip.offsetWidth;
  const h = tooltip.offsetHeight;
  let left = r.left;
  let top = r.bottom + 4;
  if (top + h > window.innerHeight - 8) top = r.top - h - 4;
  if (left + w > window.innerWidth - 8) left = window.innerWidth - 8 - w;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

// 离开单词和卡片后延迟隐藏，留出把鼠标移到按钮上的时间
function scheduleHide() {
  clearHide();
  hideTimer = setTimeout(() => {
    tooltip.style.display = 'none';
    activeWordEl = null;
  }, 300);
}

document.addEventListener('mouseover', e => {
  const w = e.target.closest('.word');
  if (w && w.dataset.w) {
    showTip(w);
    return;
  }
  if (e.target.closest('#tooltip')) {
    clearHide();
  }
});

document.addEventListener('mouseout', e => {
  const rel = e.relatedTarget;
  if (rel && (rel.closest('.word') || rel.closest('#tooltip'))) return;
  scheduleHide();
});

/* ===================== 发音 ===================== */
function audioWord(w) {
  // 多词条（如 "a, an"、"according to"）取第一个词发音
  return w.split(/[ ,]/)[0];
}
// 缓存浏览器内置语音引擎列表
let voices = [];
let voiceUS = null, voiceUK = null;   // 预先解析好的英/美音色，点击时不再查找
function loadVoices() {
  try { voices = window.speechSynthesis.getVoices(); } catch (e) { voices = []; }
  voiceUK = pickVoice('uk');
  voiceUS = pickVoice('us');
}
function pickVoice(accent) {
  const lang = accent === 'uk' ? 'en-GB' : 'en-US';
  return voices.find(v => v.lang === lang)
      || voices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith(lang))
      || voices.find(v => v.lang.toLowerCase().startsWith('en'));
}
if ('speechSynthesis' in window) {
  // 提前多轮加载语音列表（部分浏览器首次 getVoices 返回空）
  loadVoices();
  setTimeout(loadVoices, 50);
  setTimeout(loadVoices, 300);
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  // 页面加载即预热语音引擎，消除首次点击的冷启动延迟
  try {
    const warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0;
    warm.rate = 1;
    window.speechSynthesis.speak(warm);
  } catch (e) {}
}

// 浏览器内置发音：无需联网，英音=en-GB、美音=en-US
function speak(w, accent) {
  const aw = audioWord(w);
  const lang = accent === 'uk' ? 'en-GB' : 'en-US';
  const synth = window.speechSynthesis;
  if (!voiceUS || !voiceUK) loadVoices();      // 兜底：语音列表晚到

  // 关键：仅在真的有内容在播时才 interrupt，空闲时直接 speak，省掉 cancel 的额外等待
  if (synth.speaking || synth.pending) synth.cancel();
  if (synth.paused) synth.resume();

  const u = new SpeechSynthesisUtterance(aw);
  u.lang = lang;
  u.rate = 1;
  u.pitch = 1;
  u.volume = 1;
  const v = accent === 'uk' ? voiceUK : voiceUS;
  if (v) u.voice = v;
  synth.speak(u);
}

// Chrome/Edge 的语音引擎空闲约 15 秒后会「睡着」，下次说话要多等一拍。
// 每 8 秒发一个静音空串把它唤醒，保证点击喇叭是即时出声。
if ('speechSynthesis' in window) {
  setInterval(() => {
    const synth = window.speechSynthesis;
    if (synth.speaking || synth.pending) return;
    try {
      const k = new SpeechSynthesisUtterance('.');
      k.volume = 0;
      k.rate = 2;
      synth.speak(k);
    } catch (e) {}
  }, 8000);
}

// 有道真人发音（备用：在系统浏览器中直接打开本文件时音质更好）
function playYoudao(w, accent) {
  const aw = audioWord(w);
  const type = accent === 'uk' ? 1 : 2;   // type=1 英音, type=2 美音
  const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(aw)}&type=${type}`;
  const a = new Audio(url);
  a.play().catch(() => {});
}

function playAudio(w, accent) {
  if ('speechSynthesis' in window) {
    speak(w, accent);
  } else {
    playYoudao(w, accent);
  }
}

document.addEventListener('click', e => {
  // 故事一 / 故事二 切换
  const tab = e.target.closest('.story-tab');
  if (tab) {
    const g = groups.find(x => x.id === currentGroup);
    if (g) {
      currentStory = Number(tab.dataset.idx);
      applyStory(g);
      clearHide();
      tooltip.style.display = 'none';
    }
    return;
  }
  const g = e.target.closest('.grp');
  if (g && !g.classList.contains('disabled')) {
    renderGroup(parseInt(g.dataset.id, 10));
    clearHide();
    tooltip.style.display = 'none';
    return;
  }
  // 音标后的小喇叭：点击立即读美式发音
  const spk = e.target.closest('.spk');
  if (spk) {
    playAudio(spk.dataset.w, 'us');
    spk.classList.add('on');
    setTimeout(() => spk.classList.remove('on'), 200);
    return;
  }
  const b = e.target.closest('.play');
  if (b) {
    playAudio(b.dataset.w, b.dataset.accent);
  }
});

/* ===================== 初始化 ===================== */
renderSidebar();
renderGroup(1);
</script>
